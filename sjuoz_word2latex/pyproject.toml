[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sjuoz-word2latex"
version = "1.0.0"
description = "SJUOZ dergisi için Word / LaTeX / PDF (makale + kapak mektubu) -> XeLaTeX/PDF dönüştürücü; kontrol raporu, Crossref/JATS XML ve BibTeX üretir"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Science Journal of University of Zakho"}]
dependencies = ["lxml>=4.6"]

[project.optional-dependencies]
tam = ["Pillow>=9", "matplotlib>=3.5", "pypdf>=3", "pdf2docx>=0.5.6", "pymupdf<2", "pypandoc_binary>=1.13", "python-docx>=1.1"]
pdf = ["pdf2docx>=0.5.6", "pymupdf<2"]
latex = ["pypandoc_binary>=1.13"]
word = ["pypandoc_binary>=1.13", "python-docx>=1.1"]
test = ["pytest>=7", "Pillow>=9", "matplotlib>=3.5", "pdf2docx>=0.5.6", "pymupdf<2", "pypandoc_binary>=1.13", "python-docx>=1.1"]

[project.scripts]
sjuoz-word2latex = "sjuoz.cli:main"

[project.gui-scripts]
sjuoz-gui = "sjuoz.gui:main"

[tool.setuptools]
packages = ["sjuoz"]
include-package-data = true

[tool.setuptools.package-data]
sjuoz = ["data/*.png", "data/*.csl", "data/schemas/crossref/*.xsd", "data/schemas/crossref/*.md",
         "data/schemas/crossref/standard-modules/*.xsd", "data/schemas/crossref/standard-modules/mathml3/*.xsd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
